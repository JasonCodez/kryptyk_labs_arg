services:
  - type: web
    name: kryptyk-labs-arg
    env: node
    region: oregon
    branch: main
    buildCommand: "npm ci && npm run build"
    startCommand: "npx prisma migrate deploy && npm run start"
    autoDeploy: true
    envVars:
      - key: BETA_ONLY_MODE
        value: "false"
      - key: BETA_ALLOWLIST_EMAILS
        value: ""

