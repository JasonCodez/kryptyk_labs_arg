name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint repository
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Build application
        run: npm run build

  puzzle-browser:
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_URL: http://localhost:3000
      # Fixed test-only signing key. This is not a production credential.
      NEXTAUTH_SECRET: puzzlewarz-crossword-e2e-only-not-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint Word Trove changes
        run: npm run lint:word-search

      - name: Run crossword browser tests
        run: npm run test:crossword

      - name: Run Anagram Blitz browser tests
        run: npm run test:anagram

      - name: Run Sudoku browser tests
        run: npm run test:sudoku

      - name: Run Word Trove browser tests
        run: npm run test:word-search
